appId: com.spacetrash.app
productName: SpaceTrash
copyright: Copyright © SpaceTrash
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
directories:
  output: ../../dist/desktop
  buildResources: buildResources
files:
  - src/main.js
  - build/server.cjs
  - build/walk-worker.cjs
  - renderer/**/*
  - package.json
extraMetadata:
  name: SpaceTrash
  main: src/main.js
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SpaceTrash
  uninstallDisplayName: SpaceTrash
  installerLanguages:
    - en_US
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-Setup-${version}.${ext}"
portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
mac:
  category: public.app-category.utilities
  identity: null
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
dmg:
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
linux:
  category: Utility
  synopsis: Disk optimiser — scan, classify, confirm-to-act
  target:
    - AppImage
    - deb
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
appImage:
  artifactName: "${productName}-${version}-linux-${arch}.AppImage"
deb:
  artifactName: "${productName}-${version}-linux-${arch}.deb"
electronVersion: 34.5.8
# Host Node is often a newer ABI than Electron. Swap better-sqlite3 to the
# Electron prebuild in dist scripts; do not let electron-builder rebuild from source.
npmRebuild: false
publish:
  provider: generic
  url: http://192.168.0.100/spacetrash
electronLanguages:
  - en-US
